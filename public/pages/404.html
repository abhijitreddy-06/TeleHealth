<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="/css/404.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #f9fafb;
            --text-color: #1f2937;
            --hover-color: #4338ca;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        a {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        a:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .error-code {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .container {
            max-width: 800px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 3.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 30px 20px;
            }
        }
    /* ===============================
   STRICT SIMPLE FOOTER OVERRIDE
   =============================== */

.simple-footer {
    all: unset;
    display: block;
    background-color: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 0.6rem 5%;          /* compact height */
    margin-top: auto;
}

/* GRID LAYOUT – DESKTOP SAFE */
.simple-footer .footer-content {
    all: unset;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
}

/* LEFT */
.simple-footer .footer-left {
    display: flex;
    align-items: center;
}

.simple-footer .footer-logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}

.simple-footer .footer-logo i {
    color: var(--secondary);
    font-size: 1.2rem;
}

/* CENTER TEXT */
.simple-footer .footer-center {
    text-align: center;
}

.simple-footer .copyright {
    color: var(--text-dark);
    font-size: 0.9rem;
    white-space: nowrap;
}

.simple-footer .footer-name {
    color: var(--text-dark);
    font-weight: 600;
    text-decoration: none;
}

.simple-footer .footer-name:hover {
    text-decoration: underline;
}

/* RIGHT ICONS */
.simple-footer .footer-right {
    display: flex;
    gap: 1rem;
    justify-content: flex-end;
}

.simple-footer .footer-socials a {
    color: var(--text-dark);
    font-size: 1.4rem; /* BIG icons */
    text-decoration: none;
}

.simple-footer .footer-socials a:hover {
    opacity: 0.7;
}

/* ===============================
   MOBILE – SMALLER HEIGHT
   =============================== */
@media (max-width: 768px) {
    .simple-footer {
        padding: 0.5rem 5%;     /* reduced height */
    }

    .simple-footer .footer-content {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
    }

    .simple-footer .footer-center {
        text-align: center;
    }

    .simple-footer .footer-right {
        justify-content: center;
    }

    .simple-footer .copyright {
        font-size: 0.8rem;
    }

    .simple-footer .footer-socials a {
        font-size: 1.3rem;
    }
}
a,
a:hover,
a:focus,
a:active,
a:visited {
    text-decoration: none !important;
}
</style>
<style>
    .global-loader {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.35);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        opacity: 1;
        transition: opacity 0.3s ease;
    }

    .global-loader.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .global-loader .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 12px;
    }

    .global-loader p {
        font-size: 14px;
        color: #374151;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    body:has(.global-loader:not(.hidden))>*:not(.global-loader) {
        opacity: 0;
    }
</style>
</head>

<body>
<div id="global-loader" class="global-loader">
    <div class="spinner"></div>
    <p>Loading, please wait…</p>
</div>
<script>
    (function () {
        const loader = document.getElementById('global-loader');
        if (!loader) return;

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                loader.classList.add('hidden');
                setTimeout(() => loader.style.display = 'none', 300);
            }, 50);
        });

        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link) return;

            if (
                link.target === '_blank' ||
                link.href.startsWith('mailto:') ||
                link.href.startsWith('tel:') ||
                link.href.startsWith('#') ||
                link.hasAttribute('download')
            ) return;

            const next = new URL(link.href, location.href);
            if (next.origin === location.origin) {
                e.preventDefault();
                loader.classList.remove('hidden');
                loader.style.display = 'flex';
                setTimeout(() => location.href = link.href, 50);
            }
        });
    })();
</script>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Oops! The page you're looking for doesn't exist or has been moved. Let's get you back to familiar territory.
        </p>
        <a href="/">Go Home</a>
    </div>
</body>

</html>
