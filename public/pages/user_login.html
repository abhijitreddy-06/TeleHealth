<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleHealth Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <style>

input[type="password"]::-ms-reveal,
input[type="password"]::-webkit-reveal,
input[type="password"]::-webkit-credentials-auto-fill-button {
    display: none !important;
}

:root {
    
    --primary: #38BDF8;
    --primary-hover: #0EA5E9;
    --secondary: #10B981;
    --background: #F9FAFB;
    --dark-bg: #1E293B;
    --card-bg: #FFFFFF;
    --text-dark: #0F172A;
    --text-light: #F1F5F9;
    --text-medium: #475569;
    --border: #E2E8F0;
    --error: #EF4444;
    --warning: #F59E0B;
    --info: #60A5FA;
    --disabled: #9CA3AF;
    --footer-bg: #1E293B;

    
    --transition: all 0.3s ease;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius: 12px;
}


[data-theme="dark"] {
    --background: #1E293B;
    --card-bg: #334155;
    --text-dark: #F1F5F9;
    --text-light: #0F172A;
    --text-medium: #CBD5E1;
    --border: #475569;
    --footer-bg: #0F172A;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Inter', 'Roboto', sans-serif;
}

body {
    background-color: var(--background);
    color: var(--text-dark);
    transition: var(--transition);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.6;
}


header {
    background-color: var(--card-bg);
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 5%;
    max-width: 1400px;
    margin: 0 auto;
}

.logo {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.logo i {
    color: var(--secondary);
    font-size: 1.5rem;
}

.logo-text {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}

.nav-links {
    display: flex;
    gap: 2rem;
    align-items: center;
}

.nav-links a {
    color: var(--text-dark);
    text-decoration: none;
    font-weight: 500;
    transition: var(--transition);
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
}

.nav-links a:hover {
    color: var(--primary);
    background-color: rgba(56, 189, 248, 0.1);
}

.btn {
    padding: 0.6rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    border: none;
}

.btn-primary {
    background-color: var(--primary);
    color: white;
}

.btn-primary:hover {
    background-color: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(56, 189, 248, 0.3);
}

.btn-outline {
    background: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
}

.btn-outline:hover {
    background-color: var(--primary);
    color: white;
}

.theme-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dark);
    font-size: 1.2rem;
    padding: 0.5rem;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.theme-toggle:hover {
    background-color: rgba(56, 189, 248, 0.1);
}


.mobile-controls {
    display: none;
    align-items: center;
    gap: 0.5rem;
}

.mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-dark);
    font-size: 1.5rem;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
}

.mobile-menu-btn:hover {
    background-color: rgba(56, 189, 248, 0.1);
}

.mobile-menu {
    position: fixed;
    top: 0;
    right: -100%;
    width: 280px;
    height: 100vh;
    background-color: var(--card-bg);
    z-index: 1000;
    padding: 2rem;
    transition: var(--transition);
    box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.mobile-menu.active {
    right: 0;
}

.close-menu {
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--text-dark);
    font-size: 1.5rem;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-menu:hover {
    background-color: rgba(56, 189, 248, 0.1);
}

.mobile-menu a {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    color: var(--text-dark);
    text-decoration: none;
    transition: var(--transition);
}

.mobile-menu a:hover {
    background-color: rgba(56, 189, 248, 0.1);
    color: var(--primary);
}

.mobile-menu .btn-outline {
    width: 100%;
    text-align: center;
    justify-content: center;
    margin-top: 1rem;
}


.container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 5%;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
}

.login-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 500px;
}

.login-form {
    width: 100%;
    background-color: var(--card-bg);
    padding: 2.5rem;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.form-header {
    margin-bottom: 2rem;
    text-align: center;
}

.form-header h1 {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    color: var(--text-dark);
}

.form-header p {
    color: var(--text-medium);
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: var(--text-dark);
}

.input-group {
    position: relative;
    display: flex;
    align-items: center;
}

.input-group .prefix {
    position: absolute;
    left: 12px;
    color: var(--text-medium);
    font-weight: 500;
}

.form-control {
    width: 100%;
    padding: 0.9rem 1.2rem 0.9rem 40px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background-color: transparent;
    color: var(--text-dark);
    transition: var(--transition);
}

.form-control:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}

.form-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 1.5rem;
}

.form-footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
    transition: var(--transition);
}

.form-footer a:hover {
    text-decoration: underline;
}


footer {
    background-color: var(--footer-bg);
    color: var(--text-light);
    padding: 3rem 5% 1.5rem;
}

.footer-content {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2.5rem;
}

.footer-logo {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.footer-about p {
    margin: 1rem 0;
    line-height: 1.6;
    color: var(--text-light);
    opacity: 0.9;
}

.footer-links h3 {
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
    position: relative;
    display: inline-block;
    color: var(--text-light);
}

.footer-links h3::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 40px;
    height: 3px;
    background: var(--primary);
    border-radius: 2px;
}

.footer-links ul {
    list-style: none;
}

.footer-links li {
    margin-bottom: 0.8rem;
}

.footer-links a {
    color: var(--text-light);
    text-decoration: none;
    transition: var(--transition);
    opacity: 0.9;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.footer-links a:hover {
    color: var(--primary);
    opacity: 1;
    padding-left: 5px;
}

.footer-bottom {
    max-width: 1400px;
    margin: 2.5rem auto 0;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 1rem;
}

.copyright {
    opacity: 0.8;
    color: var(--text-light);
}

.footer-bottom-links {
    display: flex;
    gap: 1.5rem;
}

.footer-bottom-links a {
    color: var(--text-light);
    text-decoration: none;
    opacity: 0.8;
    transition: var(--transition);
}

.footer-bottom-links a:hover {
    opacity: 1;
    color: var(--primary);
}

.signup-link {
    color: var(--primary) !important;
    font-weight: 600;
    text-decoration: none;
    transition: var(--transition);
}

.signup-link:hover {
    text-decoration: underline;
}

.chatbot-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 99;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 15px;
}

.chat-bubble {
    background: linear-gradient(to right, var(--primary), var(--secondary));
    color: white;
    padding: 15px 20px;
    border-radius: 20px 20px 0 20px;
    max-width: 250px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    animation: float 4s ease-in-out infinite;
    position: relative;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s ease;
}

.chat-bubble.active {
    opacity: 1;
    transform: translateY(0);
}

.chat-bubble:after {
    content: '';
    position: absolute;
    bottom: -10px;
    right: 0;
    border-width: 10px 0 0 15px;
    border-style: solid;
    border-color: transparent transparent transparent var(--primary);
}

.chatbot {
    width: 60px;
    height: 60px;
    background: linear-gradient(to right, var(--primary), var(--secondary));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s;
}

.chatbot:hover {
    transform: scale(1.1);
}

@media (max-width: 992px) {
    .login-form {
        max-width: 500px;
    }
}

@media (max-width: 768px) {
    .nav-links {
        display: none;
    }

    .mobile-controls {
        display: flex;
    }

    .mobile-menu-btn {
        display: flex;
    }

    .mobile-menu {
        display: flex;
    }

    .footer-content {
        grid-template-columns: 1fr;
    }
    .chat-bubble {
        max-width: 200px;
    }
}

@media (max-width: 576px) {
    .login-form {
        padding: 1.8rem;
    }

    .btn {
        padding: 0.6rem 1.2rem;
    }

    .navbar {
        padding: 1rem 5%;
    }

    .form-header h1 {
        font-size: 1.8rem;
    }
}

[data-theme="dark"] footer {
    color: var(--text-dark);
}


[data-theme="dark"] .footer-links a,
[data-theme="dark"] .copyright,
[data-theme="dark"] .footer-bottom-links a {
    color: var(--text-dark);
    opacity: 0.9;
}

        
        .simple-footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 1.5rem 5%;
            text-align: center;
            margin-top: auto;
        }
    
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
    
        .footer-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
    
        .footer-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
    
        .footer-logo i {
            color: var(--secondary);
            font-size: 1.2rem;
        }
    
        .copyright {
            color: var(--text-medium);
            font-size: 0.9rem;
        }
    
        .footer-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
    
        .footer-links a {
            color: var(--text-medium);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
        }
    
        .footer-links a:hover {
            color: var(--primary);
        }
    
        .footer-links .separator {
            color: var(--border);
        }
    
        
        @media (max-width: 768px) {
            .simple-footer {
                padding: 1rem 5%;
            }
    
            .footer-content {
                flex-direction: column;
                gap: 0.8rem;
                text-align: center;
            }
    
            .footer-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
    
            .separator {
                display: none;
            }
    
            .footer-links a {
                font-size: 0.85rem;
            }
        }
    

.simple-footer {
    all: unset;
    display: block;
    background-color: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 0.6rem 5%;          
    margin-top: auto;
}


.simple-footer .footer-content {
    all: unset;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
}


.simple-footer .footer-left {
    display: flex;
    align-items: center;
}

.simple-footer .footer-logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}

.simple-footer .footer-logo i {
    color: var(--secondary);
    font-size: 1.2rem;
}


.simple-footer .footer-center {
    text-align: center;
}

.simple-footer .copyright {
    color: var(--text-dark);
    font-size: 0.9rem;
    white-space: nowrap;
}

.simple-footer .footer-name {
    color: var(--text-dark);
    font-weight: 600;
    text-decoration: none;
}

.simple-footer .footer-name:hover {
    text-decoration: underline;
}


.simple-footer .footer-right {
    display: flex;
    gap: 1rem;
    justify-content: flex-end;
}

.simple-footer .footer-socials a {
    color: var(--text-dark);
    font-size: 1.4rem; 
    text-decoration: none;
}

.simple-footer .footer-socials a:hover {
    opacity: 0.7;
}


@media (max-width: 768px) {
    .simple-footer {
        padding: 0.5rem 5%;     
    }

    .simple-footer .footer-content {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
    }

    .simple-footer .footer-center {
        text-align: center;
    }

    .simple-footer .footer-right {
        justify-content: center;
    }

    .simple-footer .copyright {
        font-size: 0.8rem;
    }

    .simple-footer .footer-socials a {
        font-size: 1.3rem;
    }
}
a,
a:hover,
a:focus,
a:active,
a:visited {
    text-decoration: none !important;
}
</style>


</head>

<body>

<header>
        <nav class="navbar">
            <a href="/" class="logo">
                <i class="fas fa-heartbeat"></i>
                <span class="logo-text">TeleHealth</span>
            </a>

            <div class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Home</a>
                <a href="/services"><i class="fas fa-concierge-bell"></i> Services</a>
                <a href="/contact"><i class="fas fa-address-book"></i> Contact</a>
                <a href="/user_signup" class="btn btn-outline">Patient Sign Up</a>
                <a href="/doc_signup" class="btn btn-outline">Doctor Sign Up</a>
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <div class="mobile-controls">
                <button class="theme-toggle" id="mobileThemeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>


    <div class="mobile-menu" id="mobileMenu">
        <button class="close-menu" id="closeMenu">
            <i class="fas fa-times"></i>
        </button>
        <a href="/"><i class="fas fa-home"></i> Home</a>
        <a href="/services"><i class="fas fa-concierge-bell"></i> Services</a>
        <a href="/contact"><i class="fas fa-address-book"></i> Contact</a>
        <a href="/user_signup" class="btn btn-outline"> Patient Sign Up</a>
        <a href="/doc_signup" class="btn btn-outline"> Doctor Sign Up</a>
    </div>

    
    <div class="container">
        <div class="login-container">
            <div class="login-form">
                <div class="form-header">
                    <h1>Patient Login</h1>
                    <p>Sign in to access your TeleHealth account</p>
                </div>

                <form id="loginForm" action="/user_login" method="post">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-group">
                            <span class="prefix">+91</span>
                            <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number"
                                pattern="[0-9]{10}" title="Enter a 10-digit phone number" name="phone" required>
                        </div>
                        <small id="phoneError" style="color: var(--error); display: none; margin-top: 0.5rem;">Please
                            enter a valid 10-digit phone number</small>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper" style="position: relative;">
                            <input type="password" id="password" class="form-control" placeholder="Enter your password"
                                name="password" required style="padding-right: 45px;">
                            <button type="button" class="password-toggle" id="togglePassword" 
                                style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
                                background: none; border: none; cursor: pointer; color: var(--text-medium); 
                                padding: 5px; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>



                    <button type="submit" class="btn btn-primary"
                        style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>

                    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-medium);">
                        Don't have an account? <a href="/user_signup" class="signup-link">Sign Up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

<footer class="simple-footer">
    <div class="footer-content">
        <div class="footer-left">
            <a href="/user_home" class="footer-logo">
                <i class="fas fa-heartbeat"></i>
                <span>TeleHealth</span>
            </a>
        </div>
<div class="footer-center">
    <span class="copyright">
        © 2026 Built by
        <a href="https://abhijitreddy-portfolio.netlify.app/" target="_blank" rel="noopener" class="footer-name">
            Abhijit Reddy😊
        </a>.
    </span>
        </div>

        <div class="footer-right footer-socials">
            <a href="https://www.linkedin.com/in/abhijitreddy75" target="_blank" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://github.com/abhijitreddy-06" target="_blank" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
        </div>
        </footer>
<script src="/js/shared.js"></script>
<script defer>
    document.addEventListener('DOMContentLoaded', function () {

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

});
</script>



</body>

</html>
